<svg width="32" height="32" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3a7d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main circle background -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGradient)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#60a5fa" stroke-width="8" opacity="0.3"/>

  <!-- Inner decorative circles -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4"/>

  <!-- Shield shape for identity -->
  <path d="M 256 100 L 340 140 L 340 240 Q 256 300 256 320 Q 256 300 172 240 L 172 140 Z"
        fill="url(#accentGradient)" stroke="#ffffff" stroke-width="3"/>

  <!-- Euro symbol inside shield -->
  <g transform="translate(256, 210)">
    <!-- E letter -->
    <text x="-35" y="20" font-size="80" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">E</text>

    <!-- ID letters -->
    <text x="15" y="20" font-size="60" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">ID</text>
  </g>

  <!-- Bottom text: EuroID -->
  <text x="256" y="400" font-size="48" font-weight="bold" fill="#ffffff"
        font-family="Arial, sans-serif" text-anchor="middle">EuroID</text>

  <!-- Bottom text: EID -->
  <text x="256" y="445" font-size="32" font-weight="600" fill="#60a5fa"
        font-family="Arial, sans-serif" text-anchor="middle">EID Token</text>

  <!-- Accent dots -->
  <circle cx="100" cy="100" r="8" fill="#60a5fa" opacity="0.6"/>
  <circle cx="412" cy="100" r="8" fill="#60a5fa" opacity="0.6"/>
  <circle cx="100" cy="412" r="8" fill="#60a5fa" opacity="0.6"/>
  <circle cx="412" cy="412" r="8" fill="#60a5fa" opacity="0.6"/>
</svg>
