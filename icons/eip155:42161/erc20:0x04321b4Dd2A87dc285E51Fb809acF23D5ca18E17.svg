<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="aQUSD">
  <title>aQUSD</title>
  <desc>aQUSD token mark on Arbitrum One. QVTX brand: Xpress Gold #F5A623 on DNA Navy #0A2540. A Q ring encloses the dollar glyph. Arbitrum collar lower-right.</desc>

  <circle cx="128" cy="128" r="124" fill="#0A2540"/>
  <circle cx="128" cy="128" r="117" fill="none" stroke="#F5A623" stroke-width="7"/>

  <g stroke="#F5A623" fill="none" stroke-linecap="round">
    <circle cx="128" cy="128" r="100" stroke-width="10"/>
  </g>

  <g stroke="#F5A623" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M163 98
             C163 82 148 74 128 74
             C108 74 94 83 94 98
             C94 113 108 120 128 126
             C148 132 162 139 162 154
             C162 169 148 178 128 178
             C108 178 93 170 93 154"
          stroke-width="17"/>
    <path d="M128 58 L128 194" stroke-width="13"/>
  </g>

  <!-- ARBITRUM COLLAR: lower-right -->
  <g transform="translate(186,186)">
    <circle cx="0" cy="0" r="40" fill="#0A2540"/>
    <circle cx="0" cy="0" r="34" fill="#213147"/>
    <!-- Arbitrum logo: stylized arrow/A shape in light blue -->
    <g stroke="#96BEDC" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-14 18 L0 -18 L14 18" stroke-width="8"/>
      <line x1="-7" y1="4" x2="7" y2="4" stroke-width="6"/>
    </g>
  </g>
</svg>
