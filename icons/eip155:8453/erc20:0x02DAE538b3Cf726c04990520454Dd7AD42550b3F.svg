    <path d="M128 58 L128 194" stroke-width="13"/>
  </g>

  <!-- BASE COLLAR: lower-right, Base blue -->
  <g transform="translate(186,186)">
    <circle cx="0" cy="0" r="40" fill="#0A2540"/>
    <circle cx="0" cy="0" r="34" fill="#0052FF"/>
    <!-- Base 'b' shape: vertical stroke + right semicircle -->
